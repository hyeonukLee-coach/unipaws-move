<!doctype html>
<html lang="ko">
<head>

<title>유니포즈 운동 동작 한 가지</title>
<meta name="description" content="망원동 유니포즈 이현욱 코치가 선물하는 오늘의 동작!">
<meta name="robots" content="noindex">
<link rel="icon" href="logo-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Hallmark · custom: Unipaws cream + level-up yellow · genre: playful · signature: yellow level-up wipe */
/* critique: one idea per screen, warm and soft, motion carries the fun */
:root {
  --cream: #F5EFE5;
  --cream-deep: #EDE3D3;
  --beige: #D9C3A5;
  --brown: #785941;
  --brown-ink: #4E3A2A;
  --blue: #6E8CA8;
  --sun: #F7D46A;
  --sun-deep: #F2C23E;
  --white: #FFFDF9;
  --shadow: rgba(78, 58, 42, 0.14);
  --font: "Pretendard Variable", Pretendard, system-ui, -apple-system, sans-serif;
  --ease-out: cubic-bezier(0.22, 0.8, 0.3, 1);
  --ease-io: cubic-bezier(0.65, 0, 0.35, 1);
  --radius: 24px;
  --err: #B0533C;
  --ink: #1F1A17;
  --gold: #D4A84B;
  --gold-hi: #FFF1B8;
  --gold-dim: rgba(212, 168, 75, .22);
  --gold-glow: rgba(232, 190, 90, .5);
  --f-gold: #C9A227;
  --halo: rgba(255, 226, 140, .55);
  --ray: rgba(255, 255, 255, .85);
  --ray-gold: rgba(255, 236, 170, .9);
  --halo-core: rgba(190, 232, 160, .85);
  --green: #8FD08A;
  --green-glow: rgba(143, 208, 138, .7);
  --f-brown: #8A6446;
  --f-blue: #6E8CA8;
  --f-green: #7FA36B;
  --f-orange: #D9822B;
  --f-honey: #E0A526;
  --beam: rgba(255, 248, 214, .95);
  --beam-soft: rgba(255, 236, 170, 0);
  --backdrop: rgba(31, 26, 23, .5);
  --sun-glow: rgba(247, 212, 106, .75);
  --sun-sheen: rgba(255, 236, 170, .55);
  --sun-text-shadow: var(--sun-text-shadow);
}
@property --spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes goldspin { to { --spin: 360deg; } }
html, body { background: var(--cream); }
h1, h2, h3, .move-name, .lede, .yc-name { word-break: keep-all; overflow-wrap: anywhere; }
html, body { margin: 0; overflow-x: clip; min-height: 100%; }
body {
  font-family: var(--font);
  color: var(--brown-ink);
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
}
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; transition: none; }
[hidden] { display: none !important; }

/* ---------- floating paws (idle bob) ---------- */
.float-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: clip; }
.bit { position: absolute; color: var(--beige); }
.bit svg, .bit img { display: block; width: 100%; height: auto; animation: bob var(--d, 4s) var(--delay, 0s) ease-in-out infinite alternate; }
.bit.sym { opacity: .42; }
.bit.blur { filter: blur(6px); opacity: .55; }
@keyframes bob {
  from { transform: translateY(-8px) rotate(calc(var(--r, 0deg) - 4deg)); }
  to   { transform: translateY(8px)  rotate(calc(var(--r, 0deg) + 4deg)); }
}

/* ---------- layout ---------- */
.screen { position: relative; z-index: 1; min-height: 100svh; display: grid; place-items: center; padding: 40px 20px 56px; }
.wrap { width: 100%; max-width: 460px; margin: 0 auto; }
.back { position: fixed; top: 12px; left: 16px; z-index: 5; display: flex; align-items: center; gap: 2px; min-height: 40px; padding: 0 14px 0 8px; border-radius: 14px; border: 2px solid transparent; background: linear-gradient(var(--cream), var(--cream)) padding-box, conic-gradient(from var(--spin), var(--gold-dim) 0deg, var(--gold) 50deg, var(--gold-hi) 80deg, var(--gold) 110deg, var(--gold-dim) 190deg, var(--gold-dim) 360deg) border-box; animation: goldspin 3s linear infinite; box-shadow: 0 0 14px var(--gold-glow); transition: transform .25s var(--ease-out); font: inherit; font-weight: 800; font-size: 15px; color: var(--brown); cursor: pointer; }
.back svg { width: 20px; height: 20px; }
.back:hover { transform: scale(1.06); }
.back:active { transform: scale(.94); }
.again { margin-top: 16px; }
#again-btn { font-size: 17px; padding-inline: 16px; word-break: keep-all; white-space: nowrap; }
.again-mail { text-align: center; font-size: 14px; color: var(--brown); margin: 12px 0 0; }
.link-btn { display: block; margin: 4px auto 0; min-height: 44px; padding: 0 12px; border: 0; background: none; font: inherit; font-size: 14px; color: var(--brown); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.logo img { display: block; width: auto; height: 28px; }
.logo:hover { transform: scale(1.06); }
.logo:active { transform: scale(.94); }
.logo { position: fixed; top: 12px; right: 16px; z-index: 5; padding: 4px 8px; border-radius: 14px; border: 2px solid transparent; background: linear-gradient(var(--cream), var(--cream)) padding-box, conic-gradient(from var(--spin), var(--gold-dim) 0deg, var(--gold) 50deg, var(--gold-hi) 80deg, var(--gold) 110deg, var(--gold-dim) 190deg, var(--gold-dim) 360deg) border-box; animation: goldspin 3s linear infinite; box-shadow: 0 0 14px var(--gold-glow); transition: transform .25s var(--ease-out); font-weight: 800; font-size: 15px; color: var(--brown); letter-spacing: -0.01em; text-decoration: none; }
.giant {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-weight: 900; font-size: clamp(96px, 30vw, 300px); line-height: 1; letter-spacing: -0.05em;
  color: var(--white); white-space: nowrap; overflow: clip; z-index: 0;
}
.lede { font-size: 15px; color: var(--brown); margin: 0 0 8px; }
h1, h2 { text-wrap: balance; margin: 0; letter-spacing: -0.03em; line-height: 1.25; color: var(--brown-ink); overflow-wrap: break-word; min-width: 0; }
h1 { font-size: clamp(28px, 8vw, 40px); font-weight: 800; }
h2 { font-size: clamp(24px, 6.5vw, 32px); font-weight: 800; }

/* rise-in for content */
.js .rise { opacity: 0; translate: 0 16px; }
.js .in .rise { animation: rise .9s var(--ease-out) forwards; animation-delay: calc(var(--i, 0) * 110ms + 120ms); }
@keyframes rise { to { opacity: 1; translate: 0 0; } }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; cursor: pointer; border-radius: 999px; padding: 16px 28px;
  font-weight: 800; font-size: 18px; letter-spacing: -0.01em;
  --btn-bg: var(--brown); color: var(--white); text-decoration: none;
  border: 3px solid transparent;
  background: linear-gradient(var(--btn-bg), var(--btn-bg)) padding-box, conic-gradient(from var(--spin), var(--gold-dim) 0deg, var(--gold) 50deg, var(--gold-hi) 80deg, var(--gold) 110deg, var(--gold-dim) 190deg, var(--gold-dim) 360deg) border-box;
  animation: goldspin 3s linear infinite;
  box-shadow: 0 10px 24px var(--shadow), 0 0 16px var(--gold-glow);
  transition: transform .25s var(--ease-out), box-shadow .25s var(--ease-out), background-color .2s;
}
.btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 14px 30px var(--shadow); }
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn.sun { --btn-bg: var(--sun); color: var(--brown-ink); }
.btn.ink { --btn-bg: var(--ink); color: var(--white); }
.btn.wide { width: 100%; }

/* ---------- 1. email gate ---------- */
.gate-card {
  position: relative; background: var(--white); border-radius: var(--radius);
  padding: 28px 24px 24px; box-shadow: 0 18px 40px var(--shadow);
}
.field { display: block; margin: 20px 0 16px; }
.field span { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
.field input {
  width: 100%; border: 2px solid var(--cream-deep); border-radius: 14px; background: var(--cream);
  padding: 16px 16px; font-size: 17px; transition: border-color .2s;
}
.field input:focus { border-color: var(--blue); outline: none; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; margin: 8px 0; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 0px 0 0; accent-color: var(--brown); flex: none; }
details.terms { font-size: 13px; color: var(--brown); margin: 0 0 16px 32px; }
details.terms summary { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
details.terms ul { margin: 8px 0 0; padding-left: 16px; }
.err { min-height: 22px; font-size: 14px; color: var(--err); margin: 4px 0 8px; }

/* ---------- 2. preview ---------- */
.preview-title {
  font-weight: 900; font-size: clamp(44px, 13vw, 76px); line-height: 1; letter-spacing: -0.04em;
  color: var(--brown); margin: 0 0 16px; display: flex; justify-content: center;
}
.js .preview-title .ch { display: inline-block; opacity: 0; transform: translateY(40px) scale(.6) rotate(-8deg); }
.js .in .preview-title .ch { animation: pop .7s cubic-bezier(.34, 1.56, .64, 1) forwards; animation-delay: calc(var(--i) * 70ms + 150ms); }
.preview-title .ch:last-child { color: var(--blue); }
.preview-title .sp { width: 0.28em; }
@keyframes pop { to { opacity: 1; transform: none; } }
.move-name { text-align: center; font-size: 17px; font-weight: 700; color: var(--brown-ink); margin: 0 0 24px; }
.center { text-align: center; }
.reveal {
  display: grid; grid-template-rows: 0fr; transition: grid-template-rows .8s var(--ease-io);
}
.reveal.open { grid-template-rows: 1fr; }
.reveal > div { overflow: hidden; }
.reveal-body {
  margin-top: 24px; background: var(--white); border-radius: var(--radius);
  padding: 24px 24px; box-shadow: 0 14px 32px var(--shadow); font-size: 17px;
  clip-path: inset(0 0 100% 0 round var(--radius)); transition: clip-path .9s var(--ease-io) .1s;
}
.reveal.open .reveal-body { clip-path: inset(0 0 0 0 round var(--radius)); }
.reveal-body p { margin: 0; white-space: pre-line; }
.rich { white-space: normal; }
.rich > span { display: block; }
.rich .sub { font-weight: 800; color: var(--brown); margin: 12px 0 4px; }
.rich .sub:first-child { margin-top: 0; }
.rich .li { position: relative; padding-left: 16px; margin: 4px 0; }
.rich .li::before { content: ""; position: absolute; left: 4px; top: 0.7em; width: 5px; height: 5px; border-radius: 50%; background: var(--beige); }
.rich .li.arrow { padding-left: 32px; color: var(--brown); }
.rich .li.arrow::before { left: 20px; background: var(--blue); }
.rich .gap { height: 8px; }
.js .next-wrap { margin-top: 24px; opacity: 0; transform: translateY(14px); transition: opacity .6s var(--ease-out) .7s, transform .6s var(--ease-out) .7s; }
.js .reveal.open + .next-wrap { opacity: 1; transform: none; }

/* ---------- 3. level-up wipe ---------- */
.levelup { position: fixed; inset: 0; z-index: 50; pointer-events: none; display: grid; place-items: center; }
.levelup .flood { position: absolute; inset: 0; background: var(--sun); clip-path: inset(0 0 0 100%); }
.js .levelup .word {
  position: relative; font-weight: 900; font-size: clamp(56px, 18vw, 150px); letter-spacing: -0.05em; color: var(--white);
  opacity: 0; transform: scale(.7); text-shadow: 0 6px 24px var(--sun-text-shadow);
}
.levelup { grid-auto-flow: row; align-content: center; gap: 12px; justify-items: center; }
.levelup .lv-icon { position: relative; width: 88px; height: auto; opacity: 0; }
.spark { position: absolute; width: 14px; height: 14px; color: var(--white); opacity: 0; z-index: 2; }
.spark.gold { color: var(--gold-hi); }
.levelup .rays {
  position: absolute; left: 50%; top: 50%; width: 170vmax; aspect-ratio: 1; translate: -50% -50%; opacity: 0;
  background: repeating-conic-gradient(from 0deg, var(--ray) 0deg 5deg, transparent 5deg 15deg);
  -webkit-mask: radial-gradient(closest-side, var(--ink) 4%, transparent 62%); mask: radial-gradient(closest-side, var(--ink) 4%, transparent 62%);
}
.levelup .pillar {
  position: absolute; left: 50%; bottom: 0; width: min(56vw, 300px); height: 100%; translate: -50% 0; opacity: 0;
  background: linear-gradient(to top, var(--white) 0%, var(--ray-gold) 45%, transparent 100%);
  filter: blur(8px); transform-origin: 50% 100%;
}
.levelup .core { position: absolute; left: 50%; top: 50%; width: 60vmin; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; opacity: 0; background: radial-gradient(closest-side, var(--white), var(--ray-gold) 40%, transparent); }
.levelup .ring { position: absolute; left: 50%; top: 50%; width: 30vmin; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; border: 6px solid var(--white); opacity: 0; }
.levelup .lv-icon, .levelup .word, .levelup .lv-sub { z-index: 3; }
.js .levelup .lv-sub { position: relative; font-weight: 800; font-size: clamp(16px, 4.6vw, 22px); color: var(--brown-ink); opacity: 0; background: var(--ray); padding: 4px 16px; border-radius: 999px; }

/* ---------- 4. video + cards ---------- */
.video-screen { align-items: start; padding-top: 64px; }
.video-box {
  position: relative;
  width: auto; height: 44svh; aspect-ratio: 9 / 16; max-width: 100%; margin: 0 auto;
  border-radius: var(--radius); overflow: hidden; background: var(--brown-ink); box-shadow: 0 18px 40px var(--shadow);
}
/* 스크롤해도 영상이 위에 고정되어 따라와요 (뒤로 지나가는 카드는 가려요) */
.video-stick {
  position: sticky; top: 0; z-index: 4; background: var(--cream);
  margin: 0 -20px; padding: 56px 20px 12px; box-shadow: 0 12px 16px -12px var(--shadow);
}
.video-box.wide { width: 100%; height: auto; aspect-ratio: 16 / 9; }
.video-box iframe, .video-box video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
.no-video { position: absolute; inset: 0; display: grid; place-items: center; color: var(--cream); font-size: 15px; text-align: center; padding: 20px; }
.cards-wrap { position: relative; margin-top: 24px; }
.cards { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; perspective: 1000px; }
.js .cards:not(.shown) .card { opacity: 0; }
.card { position: relative; flex: 0 0 calc((100% - 24px) / 3); min-width: 0; }
.ycard {
  position: relative; display: block; width: 100%; aspect-ratio: 59 / 86; padding: 0; border: 0; background: none; cursor: pointer;
  perspective: 800px; transition: transform .4s var(--ease-out); border-radius: 10px;
}
.ycard-inner { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.34, 1.3, .64, 1); transition-delay: calc(var(--i, 0) * 70ms + 120ms); }
.js .cards:not(.dealt) .ycard-inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 10px 22px var(--shadow); overflow: hidden;
}
.face.back {
  transform: rotateY(180deg); display: grid; place-items: center;
  background: radial-gradient(circle at 50% 45%, var(--f-brown), var(--brown-ink) 75%);
  border: 4px solid var(--beige);
}
.face.back img { width: 46%; height: auto; opacity: .95; }
.face.front {
  display: grid; grid-template-rows: auto auto 1fr auto; gap: 4px; padding: 8px;
  background: linear-gradient(160deg, var(--frame), var(--brown-ink) 160%); text-align: left;
}
.yc-name { display: block; background: var(--cream); border-radius: 4px; padding: 4px; font-size: 12px; font-weight: 900; color: var(--ink); letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.yc-stars { display: flex; justify-content: flex-end; color: var(--sun); font-size: 8px; line-height: 1; padding-right: 4px; }
.yc-art {
  display: grid; place-items: center; border-radius: 4px; border: 2px solid var(--beige);
  background: var(--white); overflow: hidden;
  font-size: clamp(28px, 9vw, 44px); line-height: 1;
}
.yc-text { display: block; background: var(--cream); border-radius: 4px; padding: 4px; font-size: 10px; font-weight: 700; color: var(--brown); text-align: center; }
.js .yc-hint {
  position: absolute; left: 8px; right: 8px; bottom: 8px; border-radius: 8px; padding: 4px 0; text-align: center;
  background: var(--sun); color: var(--ink); font-weight: 900; font-size: 12px;
  opacity: 0; transform: translateY(6px) rotate(-4deg); transition: opacity .25s, transform .35s var(--ease-out);
}
@media (hover: hover) {
  .cards.dealt .ycard:hover { transform: scale(1.06); z-index: 2; }
  .cards.dealt .ycard:hover .yc-hint { opacity: 1; transform: none; }
}
.ycard:focus-visible .yc-hint { opacity: 1; transform: none; }
.cards.dealt .ycard.press { transform: scale(.9); transition-duration: .1s; }
.cards.idle .card { transform-origin: 50% 0; animation: jingle 2s ease-in-out infinite; animation-delay: calc(var(--i) * 140ms); }
@keyframes jingle {
  0%, 62% { transform: none; }
  70% { transform: translateY(-3px) rotate(-2.2deg); }
  78% { transform: translateY(-3px) rotate(2deg); }
  85% { transform: translateY(-2px) rotate(-1.4deg); }
  92% { transform: translateY(-1px) rotate(.8deg); }
  100% { transform: none; }
}
.yc-art img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 2px; }
.beam {
  position: absolute; left: 15%; width: 70%; height: 140%; top: -20%; pointer-events: none; z-index: 3;
  background: linear-gradient(to top, var(--beam-soft), var(--beam) 50%, var(--beam-soft));
  filter: blur(10px); mix-blend-mode: screen; opacity: 0; border-radius: 50%;
}
.flash { position: absolute; inset: -20px; pointer-events: none; z-index: 3; border-radius: 32px; background: radial-gradient(circle, var(--beam), var(--beam-soft) 70%); opacity: 0; }

/* card panel: 카드 아래에서 촥! 펼쳐지는 내용 */
.cardpanel-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .55s cubic-bezier(.65, 0, .35, 1); perspective: 1200px; }
.cardpanel-wrap.open { grid-template-rows: 1fr; }
.cardpanel-wrap > .cp-clip { overflow: hidden; min-height: 0; }
.cardpanel {
  margin-top: 20px; border-radius: 20px; padding: 12px; transform-origin: 50% 0;
  background: linear-gradient(160deg, var(--frame), var(--brown-ink) 170%); box-shadow: 0 16px 36px var(--shadow);
}
.cw-top { display: flex; align-items: center; gap: 8px; background: var(--cream); border-radius: 12px; padding: 8px 8px 8px 12px; }
.cw-emoji { font-size: 28px; line-height: 1; }
.cw-icon { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex: none; }
.ov-head { display: flex; align-items: center; gap: 8px; margin: 20px 0 8px; padding-top: 16px; border-top: 2px dashed var(--cream-deep); font-weight: 900; font-size: 17px; color: var(--ink); }
.ov-head:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.ov-head img { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; }
.cw-top h3 { margin: 0; flex: 1; font-size: 20px; font-weight: 900; letter-spacing: -0.02em; color: var(--ink); }
.cw-close { min-height: 40px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--white); cursor: pointer; display: flex; align-items: center; gap: 4px; color: var(--ink); font-weight: 800; font-size: 14px; }
.cw-close svg { width: 16px; height: 16px; }
.cw-body { margin-top: 8px; background: var(--white); border-radius: 12px; padding: 20px; font-size: 16px; border: 2px solid var(--beige); }
#cw-text { margin: 0; }
.cards.dealt .ycard[aria-expanded="true"] { transform: translateY(-6px) scale(1.04); }
.cards.dealt .ycard[aria-expanded="true"] .face.front { box-shadow: 0 0 0 3px var(--gold), 0 12px 24px var(--gold-glow); }

.more { margin: 48px 0 24px; position: relative; isolation: isolate; }
.cards-wrap { padding-top: 16px; }
.more .btn { z-index: 1; }
.more::before {
  content: ""; position: absolute; inset: -48px -12px; z-index: -1; pointer-events: none;
  background: conic-gradient(from var(--spin), transparent 0 18deg, var(--halo) 28deg, transparent 38deg 78deg, var(--halo) 88deg, transparent 98deg 138deg, var(--halo) 148deg, transparent 158deg 198deg, var(--halo) 208deg, transparent 218deg 258deg, var(--halo) 268deg, transparent 278deg 318deg, var(--halo) 328deg, transparent 338deg);
  -webkit-mask: radial-gradient(closest-side, var(--ink) 25%, transparent 100%); mask: radial-gradient(closest-side, var(--ink) 25%, transparent 100%);
  animation: goldspin 14s linear infinite;
}
.more::after {
  content: ""; position: absolute; inset: -20px -8px; z-index: -1; pointer-events: none; border-radius: 999px;
  background: radial-gradient(closest-side, var(--halo-core), transparent); filter: blur(8px);
  animation: halo 2.4s ease-in-out infinite;
}
@keyframes halo { 50% { opacity: .5; transform: scale(1.06); } }
.btn.shine {
  width: 100%; padding: 24px 28px; font-size: 21px; --btn-bg: var(--green); color: var(--ink); position: relative; overflow: hidden;
  animation: goldspin 3s linear infinite, breathe 2.4s ease-in-out infinite;
}
.btn.shine::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(105deg, transparent 35%, var(--sun-sheen) 50%, transparent 65%);
  background-size: 250% 100%; background-position: 130% 0; animation: sheen 2.8s ease-in-out infinite;
}
@keyframes sheen { 0%, 35% { background-position: 130% 0; } 100% { background-position: -130% 0; } }
@keyframes breathe { 50% { box-shadow: 0 10px 34px var(--green-glow); } }

  .js .rise, .js .preview-title .ch, .js .cards .card { opacity: 1; transform: none; translate: 0 0; }
}
</style>
</head>
<body>
<noscript><p style="padding:24px">이 페이지는 자바스크립트를 켜야 볼 수 있어요.</p></noscript>

<a class="logo" href="https://unipaws.kr/home" target="_blank" rel="noopener" aria-label="유니포즈 홈페이지">

<!-- 1. 이메일 -->
<main id="s-gate" class="screen">

  <div class="wrap">
    <div class="gate-card">

<script>
/* =========================================================
   설정: 구글 앱스 스크립트 웹 앱 주소 (…/exec)
   비워 두면 예시 데이터로 보여 줘요 (미리보기용).
   ========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbxD579CAFzeSF6ECi6tSo320F83y8QwHhb3ALkcG9v-_ukPjzqwojq0UbSVzdH0CEFvCQ/exec";

const DEMO = {
  id: "sit-stand",
  name: "앉았다 일어서기",
  preview: "간식 하나로 뒷다리를 써 보는 동작이에요.\n집에서 매트 한 장만 있으면 바로 해볼 수 있어요.",
  video: "",
  cards: [
    { title: "동작 설명", body: "뒷다리로 몸을 밀어 올리는 연습이에요." },
    { title: "핸들링 방법", body: "간식을 코앞에 두고 '앉아'를 한 다음,\n간식을 살짝 위로 올려 천천히 일어서게 이끌어 주세요." },
    { title: "단계", body: "1. 매트 위에서 앉아\n2. 간식을 올리며 천천히 일어서기\n3. 다시 앉아" },
    { title: "주의사항", body: "미끄럽지 않은 매트 위에서 해요.\n고개를 돌리거나 자리를 뜨면 쉬어 가요.\n아프거나 불편해 보이면 수의사 선생님과 먼저 상담해 주세요." },
    { title: "꿀팁", body: "빠르게보다 천천히가 포인트예요." }
  ],
  course: ""
};

const $ = (s) => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const params = new URLSearchParams(location.search);
const moveId = (params.get("m") || "").replace(/[^a-zA-Z0-9_-]/g, "");
const demoMode = !API_URL || params.get("demo") === "1"; // ?demo=1 이면 예시로 미리보기
let move = null;

/* ---------- floating paws ---------- */
const PAW = '<svg viewBox="0 0 64 64" fill="currentColor"><ellipse cx="32" cy="42" rx="14" ry="12"/><ellipse cx="14" cy="26" rx="6" ry="8"/><ellipse cx="25" cy="16" rx="6" ry="8"/><ellipse cx="39" cy="16" rx="6" ry="8"/><ellipse cx="50" cy="26" rx="6" ry="8"/></svg>';
const BONE = '<svg viewBox="0 0 80 32" fill="currentColor"><circle cx="10" cy="9" r="8"/><circle cx="10" cy="23" r="8"/><circle cx="70" cy="9" r="8"/><circle cx="70" cy="23" r="8"/><rect x="10" y="9" width="60" height="14" rx="7"/></svg>';
// 리플렛처럼: 유니포즈 발바닥 심볼을 은은하게 흩뿌리기
const SYM = '<img src="logo-icon.png" alt="">';
const bits = [
  [SYM, 7, 10, 40, -14, false], [SYM, 82, 16, 34, 12, false], [SYM, 88, 52, 44, -8, false],
  [SYM, 4, 46, 30, 16, false], [SYM, 10, 76, 42, 8, false], [SYM, 74, 84, 36, -16, false],
  [BONE, 46, 92, 48, -10, false], [PAW, -6, 88, 120, 10, true], [PAW, 86, -4, 110, -20, true]
];
const floats = $("#floats");
bits.forEach(([svg, x, y, w, r, blur]) => {
  const d = document.createElement("div");
  d.className = "bit" + (blur ? " blur" : "") + (svg === SYM ? " sym" : "");
  d.style.cssText = `left:${x}%;top:${y}%;width:${w}px;--r:${r}deg;--d:${(3.2 + Math.random() * 1.8).toFixed(2)}s;--delay:${(-Math.random() * 4).toFixed(2)}s`;
  d.innerHTML = svg;
  floats.appendChild(d);
});

/* ---------- screens ---------- */
let current = "s-gate";
function show(id, push = true) {
  if (current === "s-video" && id !== "s-video") { closeCard(); $("#video-box").innerHTML = ""; } // 영상 화면을 떠나면 영상 멈춤
  if (push && id !== current) history.pushState({ s: id }, "");
  current = id;
  $("#back").hidden = id === "s-gate";
  if (id === "s-gate") resetGate();
  document.querySelectorAll("main.screen").forEach((m) => { m.hidden = m.id !== id; m.classList.remove("in"); });
  const el = document.getElementById(id);
  window.scrollTo(0, 0);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
}

/* ---------- 1. email gate ---------- */
async function loadName() {
  // 첫 화면 제목은 늘 "오늘의 동작!" (동작 이름은 다음 화면부터)
  if (demoMode) return;
  if (!moveId) { $("#gate-name").textContent = "링크를 다시 확인해 주세요"; gateBlocked = true; resetGate(); return; }
  try {
    const r = await fetch(`${API_URL}?m=${encodeURIComponent(moveId)}`);
    const j = await r.json();
    if (!j.ok) { $("#gate-name").textContent = "지금은 열 수 없는 동작이에요"; gateBlocked = true; resetGate(); }
  } catch (e) { /* 이름을 못 불러와도 이메일 입력은 할 수 있게 둔다 */ }
}

// 한 번 이메일을 남긴 분은 이 휴대폰(브라우저)에 기억해 두고, 다음부터 버튼 하나로 열어요
const SAVE_KEY = "unipaws_email";
function loadSaved() {
  try { const v = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); return v && v.email ? v : null; } catch (e) { return null; }
}
function saveEmail(email, news) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ email, news: !!news })); } catch (e) {}
}
function maskEmail(e) {
  const [id, dom] = e.split("@");
  return (id.length <= 2 ? id[0] + "*" : id.slice(0, 2) + "*".repeat(Math.min(4, id.length - 2))) + "@" + dom;
}
const BTN_LABEL = { "gate-btn": "열어 보기", "again-btn": "저번에 입력한 이메일로 입장하기!" };
let gateBlocked = false;
function resetGate() {
  Object.entries(BTN_LABEL).forEach(([id, label]) => { const b = document.getElementById(id); b.textContent = label; b.disabled = gateBlocked; });
  $("#gate-err").textContent = ""; $("#again-err").textContent = "";
}

async function openMove(email, news, btn, err) {
  err.textContent = "";
  btn.disabled = true; btn.textContent = "여는 중…";
  try {
    if (demoMode) { await new Promise((r) => setTimeout(r, 500)); move = DEMO; }
    else {
      const r = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ m: moveId, email, consent: true, news })
      });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "fail");
      move = j.move;
    }
    saveEmail(email, news);
    startPreview();
  } catch (e) {
    err.textContent = "잠깐 연결이 어려워요. 조금 뒤에 다시 눌러 주세요.";
    btn.disabled = false; btn.textContent = BTN_LABEL[btn.id];
  }
}

$("#gate-form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const email = $("#email").value.trim();
  const err = $("#gate-err");
  err.textContent = "";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = "이메일 주소를 한 번 더 확인해 주세요."; $("#email").focus(); return; }
  if (!$("#agree").checked) { err.textContent = "필수 동의에 체크해 주시면 열 수 있어요."; return; }
  openMove(email, $("#news").checked, $("#gate-btn"), err);
});

const saved = loadSaved();
if (saved) {
  $("#again").hidden = false;
  $("#gate-form").hidden = true;
  $("#again-mail").textContent = maskEmail(saved.email) + " 로 열어요";
  $("#again-btn").addEventListener("click", () => openMove(saved.email, saved.news, $("#again-btn"), $("#again-err")));
  $("#again-other").addEventListener("click", () => {
    $("#again").hidden = true; $("#gate-form").hidden = false;
    $("#email").focus();
  });
}

/* ---------- 2. preview ---------- */
function startPreview() {
  $("#pv-reveal").classList.remove("open");
  $("#pv-btn").setAttribute("aria-expanded", "false");
  $("#go-video").tabIndex = -1;
  $("#pv-name").textContent = move.name;
  $("#pv-text").textContent = move.preview || "";
  show("s-preview");
}
$("#pv-btn").addEventListener("click", () => {
  $("#pv-reveal").classList.add("open");
  $("#pv-btn").setAttribute("aria-expanded", "true");
  $("#go-video").tabIndex = 0;
  setTimeout(() => $("#go-video").focus({ preventScroll: true }), 900);
});

/* ---------- 3. level up ---------- */
// slow start, rush through the middle, soft settle
const COVER = [[0,0],[.031,.006],[.134,.012],[.206,.023],[.278,.047],[.34,.07],[.412,.105],[.485,.158],[.546,.246],[.583,.55],[.62,.825],[.69,.9],[.79,.94],[.85,.956],[.93,.975],[1,1]];
function cover(t) {
  for (let i = 1; i < COVER.length; i++) {
    const [t1, c1] = COVER[i], [t0, c0] = COVER[i - 1];
    if (t <= t1) { const k = (t - t0) / (t1 - t0); return c0 + (c1 - c0) * (3 * k * k - 2 * k * k * k); }
  }
  return 1;
}
const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg>';

$("#go-video").addEventListener("click", () => {
  const lv = $("#levelup"), flood = lv.querySelector(".flood"), word = lv.querySelector(".word");
  lv.hidden = false;
  if (reduce) { flood.style.clipPath = "none"; word.style.opacity = 1; word.style.transform = "none"; setTimeout(enterVideo, 500); return; }
  const t0 = performance.now(), DUR = 650;
  (function step(now) {
    const t = Math.min(1, (now - t0) / DUR), c = cover(t);
    flood.style.clipPath = `inset(0 0 0 ${(1 - c) * 100}%)`;
    if (t < 1) requestAnimationFrame(step);
    else burst();
  })(t0);
  function burst() {
    const q = (sel) => lv.querySelector(sel);
    const EO = "cubic-bezier(.22,.8,.3,1)";
    q(".core").animate([{ opacity: 0, transform: "scale(.2)" }, { opacity: 1, transform: "scale(1.2)", offset: .25 }, { opacity: 0, transform: "scale(1.8)" }], { duration: 700, easing: EO, fill: "forwards" });
    q(".ring").animate([{ opacity: .9, transform: "scale(.3)" }, { opacity: 0, transform: "scale(4)" }], { duration: 700, easing: EO, fill: "forwards" });
    q(".rays").animate([{ opacity: 0, transform: "scale(.4) rotate(0deg)" }, { opacity: .9, transform: "scale(1) rotate(25deg)", offset: .3 }, { opacity: .6, transform: "scale(1.05) rotate(70deg)" }], { duration: 1300, easing: "ease-out", fill: "forwards" });
    q(".pillar").animate([{ opacity: 0, transform: "scaleY(0)" }, { opacity: 1, transform: "scaleY(1)", offset: .35 }, { opacity: .5, transform: "scaleY(1.05)" }], { duration: 1000, easing: EO, fill: "forwards" });
    const sub = q(".lv-sub");
    if (sub) sub.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 400, delay: 250, easing: EO, fill: "forwards" });
    const icon = lv.querySelector(".lv-icon");
    if (icon) icon.animate([{ opacity: 0, transform: "translateY(24px) scale(.5) rotate(-12deg)" }, { opacity: 1, transform: "translateY(-6px) scale(1.1) rotate(6deg)" }, { opacity: 1, transform: "none" }],
      { duration: 700, easing: "cubic-bezier(.34,1.56,.64,1)", fill: "forwards" });
    word.animate([{ opacity: 0, transform: "scale(.7)" }, { opacity: 1, transform: "scale(1.08)" }, { opacity: 1, transform: "scale(1)" }],
      { duration: 650, easing: "cubic-bezier(.34,1.56,.64,1)", fill: "forwards" });
    for (let i = 0; i < 30; i++) {
      const s = document.createElement("div");
      s.className = "spark" + (i % 3 ? "" : " gold"); s.innerHTML = STAR;
      const a = (i / 30) * Math.PI * 2 + Math.random() * .2, dist = 110 + Math.random() * 240, size = 8 + Math.random() * 22;
      s.style.width = s.style.height = size + "px";
      lv.appendChild(s);
      s.animate([
        { opacity: 0, transform: "translate(0,0) scale(.3) rotate(0deg)" },
        { opacity: 1, offset: .3 },
        { opacity: 0, transform: `translate(${Math.cos(a) * dist}px, ${Math.sin(a) * dist}px) scale(1) rotate(180deg)` }
      ], { duration: 800 + Math.random() * 300, easing: "cubic-bezier(.22,.8,.3,1)", fill: "forwards" }).onfinish = () => s.remove();
    }
    setTimeout(() => { enterVideo(); lv.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: "forwards" }).onfinish = () => {
      lv.hidden = true; lv.getAnimations({ subtree: true }).forEach((x) => x.cancel()); word.getAnimations().forEach((x) => x.cancel()); flood.style.clipPath = ""; }; }, 1000);
  }
});

/* ---------- 4. video + cards ---------- */
function videoEmbed(url) {
  if (!url) return null;
  let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);
  if (m) return { kind: "iframe", src: `https://www.youtube-nocookie.com/embed/${m[1]}?playsinline=1&rel=0`, wide: !/shorts\//.test(url) };
  // 비메오: vimeo.com/123, vimeo.com/123/해시(비공개 링크), player.vimeo.com/video/123?h=해시
  m = url.match(/vimeo\.com\/(?:.*?\/)?(?:video\/)?(\d{6,})(?:\/([0-9a-f]{6,}))?/i);
  if (m) {
    const h = m[2] || (url.match(/[?&]h=([0-9a-f]+)/i) || [])[1];
    return { kind: "iframe", vimeo: true, wide: true, page: url,
      src: `https://player.vimeo.com/video/${m[1]}?${h ? "h=" + h + "&" : ""}playsinline=1&title=0&byline=0&portrait=0&dnt=1` };
  }
  m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (m) return { kind: "iframe", src: `https://drive.google.com/file/d/${m[1]}/preview`, wide: false };
  if (/^https:\/\/.+\.(mp4|webm|mov)(\?|$)/i.test(url)) return { kind: "video", src: url };
  return null;
}

function enterVideo(push = true) {
  $("#v-name").textContent = move.name;
  const box = $("#video-box");
  box.innerHTML = "";
  const v = videoEmbed(move.video);
  if (!v) {
    box.innerHTML = '<div class="no-video">영상은 곧 이 자리에 올라와요</div>';
  } else if (v.kind === "iframe") {
    const f = document.createElement("iframe");
    f.src = v.src; f.title = move.name + " 영상"; f.allow = "autoplay; encrypted-media; picture-in-picture"; f.allowFullscreen = true; f.referrerPolicy = "strict-origin-when-cross-origin";
    box.classList.toggle("wide", v.wide);
    box.style.aspectRatio = "";
    box.appendChild(f);
    if (v.vimeo) {
      // 비메오 영상의 실제 가로·세로 비율에 맞춰 상자 모양을 바꿔요 (세로 영상이면 세로로)
      fetch(`https://vimeo.com/api/oembed.json?url=${encodeURIComponent(v.page)}`)
        .then((r) => r.json())
        .then((o) => { if (o.width && o.height) { box.classList.toggle("wide", o.width >= o.height); box.style.aspectRatio = `${o.width} / ${o.height}`; } })
        .catch(() => {});
    }
  } else {
    const el = document.createElement("video");
    el.src = v.src; el.controls = true; el.playsInline = true; el.preload = "metadata";
    box.appendChild(el);
  }
  buildCards();
  show("s-video", push);
  setTimeout(dealCards, 1200);
}

// 카드 모양: 제목마다 그림과 테두리 색
const CARD_LOOK = {
  "동작 설명": ["📖", "--f-brown", "icons/card-1-explain.webp"], "핸들링 방법": ["🖐️", "--f-blue", "icons/card-2-handling.webp"],
  "단계": ["🪜", "--f-green", "icons/card-3-steps.webp"], "주의사항": ["⚠️", "--f-orange", "icons/card-4-caution.webp"],
  "꿀팁": ["🍯", "--f-honey", "icons/card-5-tip.webp"], "한눈에 보기!": ["📋", "--f-gold", "icons/card-6-overview.webp"]
};
const OVERVIEW = "한눈에 보기!";
const lookOf = (title) => CARD_LOOK[String(title).replace(/\s+/g, " ").trim()] || ["🐾", "--f-brown", ""];

function buildCards() {
  const ul = $("#cards");
  ul.innerHTML = "";
  ul.classList.remove("shown", "dealt", "idle");
  $("#more").hidden = true;
  openIndex = -1; const cp = $("#cardpanel"); cp.hidden = true; cp.classList.remove("open");
  const list = (move.cards || []).concat(move.cards && move.cards.length ? [{ title: OVERVIEW, all: true }] : []);
  list.forEach((c, i) => {
    const [emoji, frame, icon] = lookOf(c.title);
    const li = document.createElement("li");
    li.className = "card";
    li.style.cssText = `--i:${i};--frame:var(${frame})`;
    li.innerHTML = `<button class="ycard" type="button" aria-expanded="false" aria-controls="cardpanel">
      <span class="ycard-inner">
        <span class="face back"><img src="logo-icon.png" alt="" onerror="this.remove()"></span>
        <span class="face front">
          <span class="yc-name"></span>
          <span class="yc-stars" aria-hidden="true">★★★★</span>
          <span class="yc-art" aria-hidden="true"></span>
          <span class="yc-text">눌러서 펼쳐 보기</span>
        </span>
      </span>
      <span class="yc-hint" aria-hidden="true">이 카드 보기!</span></button>`;
    li.querySelector(".yc-name").textContent = c.title;
    const art = li.querySelector(".yc-art");
    if (icon) { const im = document.createElement("img"); im.src = icon; im.alt = ""; im.onerror = () => { art.textContent = emoji; }; art.appendChild(im); }
    else art.textContent = emoji;
    li.querySelector("button").setAttribute("aria-label", c.title + " 카드 열기");
    const b = li.querySelector("button");
    b.addEventListener("pointerdown", () => b.classList.add("press"));
    b.addEventListener("pointerleave", () => b.classList.remove("press"));
    b.addEventListener("pointercancel", () => b.classList.remove("press"));
    b.addEventListener("click", (e) => {
      b.classList.remove("press");
      if (!reduce) b.animate([{ transform: "scale(.9)" }, { transform: "scale(1.12)" }, { transform: "scale(.97)" }, { transform: "scale(1)" }], { duration: 380, easing: "cubic-bezier(.34,1.56,.64,1)" });
      setTimeout(() => openCard(i, b), reduce ? 0 : 200);
    });
    ul.appendChild(li);
  });
}

function showMore() {
  if (move.course) { $("#more-link").href = move.course; $("#more").hidden = false; }
  else if (demoMode) { $("#more").hidden = false; } // 미리보기용: 코스 주소가 정해지면 시트에 넣어요
}

// 카드 등장: 부채처럼 펼침 → 아래에서 위로 빛 → 촥! 펼쳐지며 앞면
function dealCards() {
  const ul = $("#cards"), cards = [...ul.children];
  if (!cards.length) return;
  if (reduce) { ul.classList.add("shown", "dealt"); showMore(); return; }
  // 카드가 펼쳐질 자리로 부드럽게 내려가기 (영상은 위에 고정되어 따라와요)
  const vb = $("#video-box").getBoundingClientRect();
  const target = window.scrollY + $("#cards-wrap").getBoundingClientRect().top - (56 + vb.height + 20);
  if (target > window.scrollY + 4) window.scrollTo({ top: target, behavior: "smooth" });
  setTimeout(() => dealNow(ul, cards), target > window.scrollY + 4 ? 500 : 0);
}
function dealNow(ul, cards) {
  const ur = ul.getBoundingClientRect(), cx = ur.left + ur.width / 2, cy = ur.top + ur.height / 2, n = cards.length;
  const pos = cards.map((c, i) => {
    const r = c.getBoundingClientRect();
    return { dx: cx - (r.left + r.width / 2), dy: cy - (r.top + r.height / 2), a: (i - (n - 1) / 2) * 11 };
  });
  ul.classList.add("shown");
  const EASE = "cubic-bezier(.22,.8,.3,1)";
  cards.forEach((c, i) => {
    const p = pos[i];
    c.style.transformOrigin = "50% 110%";
    c.animate([
      { opacity: 0, transform: `translate(${p.dx}px, ${p.dy + 40}px) rotate(0deg) scale(.9)` },
      { opacity: 1, transform: `translate(${p.dx}px, ${p.dy}px) rotate(${p.a}deg) scale(1)` }
    ], { duration: 700, delay: i * 40, easing: EASE, fill: "both" });
  });
  // 빛이 아래에서 위로 쭉
  const beam = $("#beam");
  setTimeout(() => {
    beam.animate([
      { opacity: 0, transform: "translateY(55%) scaleY(.6)" },
      { opacity: 1, offset: .25 },
      { opacity: 1, offset: .8 },
      { opacity: 0, transform: "translateY(-55%) scaleY(1)" }
    ], { duration: 1100, easing: "cubic-bezier(.65,0,.35,1)", fill: "forwards" });
    cards.forEach((c) => c.animate([{ filter: "brightness(1)" }, { filter: "brightness(1.35)" }, { filter: "brightness(1)" }], { duration: 1100, composite: "add" }));
  }, 800);
  // 촥!
  setTimeout(() => {
    $("#flash").animate([{ opacity: 0 }, { opacity: 1 }, { opacity: 0 }], { duration: 500, easing: "ease-out" });
    cards.forEach((c, i) => {
      const p = pos[i];
      c.getAnimations().forEach((x) => x.cancel());
      c.animate([
        { transform: `translate(${p.dx}px, ${p.dy}px) rotate(${p.a}deg) scale(1.06)` },
        { transform: "none" }
      ], { duration: 750, delay: i * 60, easing: "cubic-bezier(.34,1.45,.64,1)", fill: "backwards" });
    });
    ul.classList.add("dealt");
    setTimeout(showMore, 900);
    setTimeout(() => { cards.forEach((c) => { c.style.transformOrigin = ""; }); ul.classList.add("idle"); }, 1200);
  }, 1950);
}

// 카드를 누르면: 카드 아래(영상 더 보러 가기 위)에서 내용이 촥! 펼쳐져요. 페이지를 그대로 스크롤해서 읽어요.
let openIndex = -1;
function openCard(i, btn) {
  if (!$("#cards").classList.contains("dealt")) return;
  if (openIndex === i) return closeCard();
  const list = move.cards.concat([{ title: OVERVIEW, all: true }]);
  const c = list[i], [emoji, frame, icon] = lookOf(c.title);
  const wrap = $("#cardpanel"), panel = wrap.querySelector(".cardpanel");
  const wasOpen = openIndex !== -1;
  openIndex = i;
  document.querySelectorAll(".ycard").forEach((b) => b.setAttribute("aria-expanded", "false"));
  btn.setAttribute("aria-expanded", "true");
  panel.style.setProperty("--frame", `var(${frame})`);
  const ic = wrap.querySelector(".cw-icon");
  if (icon) { ic.hidden = false; ic.src = icon; wrap.querySelector(".cw-emoji").hidden = true; }
  else { ic.hidden = true; const em = wrap.querySelector(".cw-emoji"); em.hidden = false; em.textContent = emoji; }
  $("#cw-title").textContent = c.all ? "모두 한눈에 보기" : c.title;
  const box = $("#cw-text");
  box.textContent = "";
  if (c.all) {
    move.cards.forEach((sec) => {
      const [, , ic2] = lookOf(sec.title);
      const h = document.createElement("div");
      h.className = "ov-head";
      if (ic2) { const im = document.createElement("img"); im.src = ic2; im.alt = ""; h.appendChild(im); }
      h.appendChild(document.createTextNode(sec.title));
      const body = document.createElement("div");
      fillRich(body, sec.body);
      box.append(h, body);
    });
  } else {
    const body = document.createElement("div");
    fillRich(body, c.body);
    box.appendChild(body);
  }
  wrap.hidden = false;
  requestAnimationFrame(() => wrap.classList.add("open"));
  if (!reduce) {
    // 촥! 카드가 위에서부터 펼쳐지듯
    panel.animate([
      { transform: "rotateX(-80deg) scaleY(.5)", opacity: 0 },
      { transform: "rotateX(10deg) scaleY(1.02)", opacity: 1, offset: .65 },
      { transform: "none", opacity: 1 }
    ], { duration: wasOpen ? 450 : 650, easing: "cubic-bezier(.22,.8,.3,1)" });
    wrap.querySelector(".cw-body").animate([{ clipPath: "inset(0 0 100% 0 round 12px)" }, { clipPath: "inset(0 0 0 0 round 12px)" }],
      { duration: 650, delay: 200, easing: "cubic-bezier(.65,0,.35,1)", fill: "backwards" });
    $("#flash").animate([{ opacity: 0 }, { opacity: .8 }, { opacity: 0 }], { duration: 400, easing: "ease-out" });
  }
  // 펼쳐진 내용의 첫 줄이 영상 바로 아래 오도록 부드럽게 내려가기
  setTimeout(() => {
    const stick = document.querySelector(".video-stick").getBoundingClientRect().height;
    const top = window.scrollY + wrap.getBoundingClientRect().top - stick - 8;
    window.scrollTo({ top, behavior: reduce ? "auto" : "smooth" });
    $("#cw-title").focus({ preventScroll: true });
  }, reduce ? 0 : 250);
}
function closeCard() {
  const wrap = $("#cardpanel");
  if (wrap.hidden) return;
  const btn = document.querySelectorAll(".ycard")[openIndex];
  openIndex = -1;
  document.querySelectorAll(".ycard").forEach((b) => b.setAttribute("aria-expanded", "false"));
  wrap.classList.remove("open");
  setTimeout(() => { wrap.hidden = true; }, reduce ? 0 : 560);
  if (btn) {
    const stick = document.querySelector(".video-stick").getBoundingClientRect().height;
    const top = window.scrollY + $("#cards-wrap").getBoundingClientRect().top - stick - 8;
    window.scrollTo({ top, behavior: reduce ? "auto" : "smooth" });
    btn.focus({ preventScroll: true });
  }
}
document.querySelector(".cw-close").addEventListener("click", closeCard);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeCard(); });

// 시트 글을 보기 좋게: "■ 제목" → 작은 소제목, "• 항목"/"→ 항목" → 들여쓴 줄 (글자는 textContent로만 넣어요)
function fillRich(el, text) {
  el.textContent = "";
  el.classList.add("rich");
  String(text || "").split("\n").forEach((line) => {
    const t = line.trim();
    const row = document.createElement("span");
    if (!t) { row.className = "gap"; }
    else if (t.startsWith("■")) { row.className = "sub"; row.textContent = t.replace(/^■\s*/, ""); }
    else if (/^[•\-]/.test(t)) { row.className = "li"; row.textContent = t.replace(/^[•\-]\s*/, ""); }
    else if (t.startsWith("→")) { row.className = "li arrow"; row.textContent = t.replace(/^→\s*/, ""); }
    else { row.className = "line"; row.textContent = t; }
    el.appendChild(row);
  });
}

/* ---------- sounds: 버튼마다 다른 경쾌한 소리 (파일 없이 브라우저가 직접 만들어요) ---------- */
let actx = null;
function audio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  } catch (e) { return null; }
}
function tone(c, freq, at, dur, type, vol, glideTo) {
  const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur * 0.6);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
const SFX = {
  // 일반 버튼: 톡! 하는 맑은 클릭
  click() { const c = audio(); if (!c) return; tone(c, 660, 0, .09, "triangle", .16, 990); tone(c, 1320, .045, .1, "sine", .08); },
  // 영상 보러 가기: 뾰로롱~ 올라가는 반짝임
  sparkle() { const c = audio(); if (!c) return; [1047, 1319, 1568, 2093, 2637].forEach((f, i) => tone(c, f, i * .065, .28, "triangle", .11)); tone(c, 3136, .34, .45, "sine", .06); },
  // 카드: 띠링~ 작은 종소리
  card() { const c = audio(); if (!c) return; tone(c, 1568, 0, .55, "sine", .14); tone(c, 3136, 0, .3, "sine", .045); tone(c, 2093, .11, .7, "sine", .14); tone(c, 4186, .11, .35, "sine", .04); }
};
document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.closest(".ycard")) SFX.card();
  else if (t.closest("#go-video, #more-link")) SFX.sparkle();
  else if (t.closest("button, .btn, a.logo")) SFX.click();
}, true);

/* ---------- start ---------- */
history.replaceState({ s: "s-gate" }, "");
show("s-gate", false);
loadName();
$("#back").addEventListener("click", () => history.back());
// 뒤로(버튼·휴대폰 뒤로 제스처): 영상 → 오늘의 동작 → 이메일 화면
window.addEventListener("popstate", (e) => {
  const s = (e.state && e.state.s) || "s-gate";
  if (!move || s === "s-gate") return show("s-gate", false);
  if (s === "s-video") return enterVideo(false);
  show(s, false);
});
</script>
